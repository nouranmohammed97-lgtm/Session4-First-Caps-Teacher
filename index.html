<html lang="en">

<title>English Capsules – First Capsule – Session 4</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--y:#B8860B;--yd:#8A6508;--yl:#FBF3DC;--yb:#E9D9A6;--ink:#2B2416;--ok:#2E7D32;--no:#C62828;--bg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#top{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:3px solid var(--y);background:#fff}
#top img{height:34px;background:#000;border-radius:4px}
#top .t{font-weight:600;color:var(--yd);font-size:14px;flex:1}
#bar{height:6px;background:var(--yl)}#bar i{display:block;height:100%;width:0;background:var(--y);transition:width .3s}
#main{flex:1;position:relative;overflow:hidden;display:flex}
#deck{flex:1;overflow:auto;position:relative}
.slide{display:none;min-height:100%;padding:28px 6vw;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.slide.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:clamp(30px,6vw,72px);margin:0;color:var(--yd);line-height:1.1}

.sub{font-size:clamp(20px,3.4vw,38px);color:var(--ink)}
.pic{max-width:min(92%,640px);max-height:52vh;object-fit:contain;border-radius:14px;border:3px solid var(--yb);background:#fff}
.pic.big.wide{width:100%;max-width:min(96%,1400px);max-height:80vh}
.pic.big{max-height:62vh;max-width:min(94%,900px)}
.logo{height:clamp(70px,16vh,150px);border-radius:10px}
.btn{font:600 15px 'Poppins',system-ui,sans-serif;border:2px solid var(--y);background:var(--y);color:#fff;padding:9px 20px;border-radius:999px;cursor:pointer;transition:.15s}
.btn:hover{background:var(--yd);border-color:var(--yd)}
.btn.o{background:#fff;color:var(--yd)}.btn.o:hover{background:var(--yl)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:var(--yl);border:2px solid var(--yb);border-radius:16px;padding:16px 22px}
input.name{font:500 20px 'Poppins',system-ui,sans-serif;padding:12px 18px;border:3px solid var(--y);border-radius:14px;width:min(420px,90%);text-align:center;color:var(--ink)}
input.name:focus{outline:3px solid var(--yb)}
.msg{min-height:22px;font-weight:600;color:var(--no)}
.sec{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center}
.sec .num{font-size:clamp(60px,14vw,150px);font-weight:700;color:var(--y);line-height:1}
.sec img{height:clamp(90px,22vh,200px)}
ol.ag{text-align:left;font-size:clamp(17px,2.4vw,26px);padding:0;list-style:none;margin:0;display:grid;gap:10px;width:min(760px,100%)}
ol.ag li{background:var(--yl);border-left:8px solid var(--y);border-radius:10px;padding:10px 18px}
.bigtxt{font-size:clamp(28px,5vw,58px);font-weight:600;color:var(--ink)}
.vwrap{display:flex;gap:24px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.vwrap .imgs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.vwrap .imgs img{max-height:44vh;max-width:min(44vw,420px);min-width:120px;object-fit:contain;border:3px solid var(--yb);border-radius:14px;background:#fff}
.vtxt{font-size:clamp(26px,4.4vw,54px);font-weight:600;max-width:640px}
.word{font-size:clamp(28px,5vw,60px);font-weight:700;color:var(--yd);min-height:1.3em;visibility:hidden}.word.show{visibility:visible}
.story{font-size:clamp(16px,2vw,23px);line-height:1.7;text-align:left;max-width:980px}
table.f{border-collapse:separate;border-spacing:6px;font-size:clamp(18px,2.8vw,32px)}
table.f td{background:var(--yl);border:2px solid var(--yb);border-radius:10px;padding:8px 24px;min-width:110px}
table.f tr.last td{background:var(--y);color:#fff;font-weight:700;border-color:var(--y)}
.ex{width:min(1000px,100%);text-align:left;display:grid;gap:8px;font-size:clamp(15px,1.9vw,21px)}
.ex .r{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:#fff;border:2px solid var(--yb);border-radius:12px;padding:7px 14px}
.ex .r .n{font-weight:700;color:var(--y);min-width:26px}
.ex.two .r{display:grid;grid-template-columns:34px 1fr 1fr;gap:10px;align-items:center}
select.g{font:600 inherit 'Poppins',system-ui,sans-serif;font-size:inherit;border:2px solid var(--y);border-radius:8px;background:var(--yl);padding:3px 6px;color:var(--ink);max-width:100%}
select.g.ok{background:#E3F4E4;border-color:var(--ok);color:var(--ok)}
select.g.no{background:#FBE4E4;border-color:var(--no);color:var(--no)}
select.g.sh{background:var(--y);border-color:var(--yd);color:#fff}
.scene{position:relative;width:min(760px,96%);height:clamp(190px,34vh,290px);border:3px dashed var(--yb);border-radius:18px;background:var(--yl);overflow:hidden}.you{position:absolute;left:14px;bottom:14px;background:var(--y);color:#fff;font-weight:700;border-radius:999px;padding:8px 16px;z-index:2}.obj{position:absolute;bottom:16px;object-fit:contain;border-radius:10px;background:#fff;border:2px solid var(--yb);transition:all .55s ease}.obj.near{left:120px;height:80%}.obj.far{left:calc(100% - 140px);height:32%}.chips{font-weight:700;color:var(--yd);min-height:26px;font-size:clamp(16px,2.2vw,22px)}.sent{font-weight:700;font-size:clamp(24px,4vw,44px);color:var(--ink);min-height:1.3em}
.qgrid{display:grid;grid-template-columns:70px 1fr 1fr;gap:10px;width:min(980px,100%);align-items:stretch}.qh{color:var(--yd);font-size:clamp(16px,2.4vw,26px);align-self:center}.qv{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}.qc{background:#fff;border:3px solid var(--y);border-radius:16px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s;text-align:center}.qc:hover{background:var(--yl)}.qw{font-size:clamp(30px,6vw,64px);font-weight:700;color:var(--y);line-height:1}.qw.real{display:none}.qc.open .qw.real{display:block}.qc.open .qw:not(.real){display:none}.qi{height:clamp(70px,16vh,140px);max-width:100%;object-fit:contain}.qd,.qs{visibility:hidden;font-size:clamp(12px,1.6vw,17px)}.qs{font-weight:700;font-size:clamp(14px,1.9vw,21px)}.qc.open .qd,.qc.open .qs{visibility:visible}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:min(1000px,100%)}.pc{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border:2px solid var(--yb);border-radius:14px;padding:10px}.pc img{height:clamp(70px,14vh,120px);max-width:100%;object-fit:contain}.pc .n{font-weight:700;color:var(--y)}.pc{font-size:clamp(14px,1.8vw,19px)}
.ga{visibility:hidden;color:var(--yd);font-weight:700}.ga.on{visibility:visible}
.vb,.ng{border-radius:5px;padding:0 3px}.vbon .vb{background:var(--y);color:#fff}.vbon .ng{background:var(--no);color:#fff}
.hlp{line-height:2.1;font-size:clamp(16px,2vw,23px)}.w{cursor:pointer;border-radius:5px;padding:1px 2px;transition:background .15s}.w:hover{background:var(--yl)}.w.mp{background:#FFE082}.w.mn{background:#F5A3A3}.w.ok{outline:2px solid var(--ok)}.w.bad{outline:2px dashed var(--no)}.w.miss{border-bottom:3px solid var(--ok)}.btn.act{box-shadow:0 0 0 3px var(--ink)}
.gm{width:min(900px,100%);display:flex;flex-direction:column;gap:12px;align-items:center}.gmtop{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-weight:700;color:var(--yd);min-height:24px}.gmbar{height:10px;background:var(--yl);border-radius:99px;width:100%;overflow:hidden}.gmbar i{display:block;height:100%;width:100%;background:var(--y)}.gmbody{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}.gms{font-size:clamp(26px,4.6vw,52px);font-weight:700}.gmopts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(560px,100%)}.gmopts .btn{font-size:clamp(18px,2.6vw,28px);padding:12px}.gmopts .btn.okc{background:var(--ok);border-color:var(--ok);color:#fff}.gmopts .btn.bad{background:var(--no);border-color:var(--no);color:#fff}.gmfb{font-weight:700;min-height:28px;font-size:clamp(16px,2.2vw,24px)}.gm .pic{max-height:30vh}
.hw{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:7px;text-decoration-color:var(--y);color:var(--yd)}.hw.b{font-weight:700}.vtxt.hid{visibility:hidden}
.eqr{display:grid;grid-template-columns:28px 1.1fr 1.1fr .7fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--yb);padding:6px 0;font-size:clamp(14px,1.8vw,20px)}.eqr .n{font-weight:700;color:var(--y)}.eqq,.eqa{visibility:hidden;font-weight:600}.eqa{color:var(--yd)}.eqr[data-s="1"] .eqq,.eqr[data-s="2"] .eqq,.eqr[data-s="2"] .eqa{visibility:visible}.eqr .btn{padding:5px 12px;font-size:13px}@media(max-width:760px){.eqr{grid-template-columns:28px 1fr}}
.es{cursor:pointer;background:var(--yl);border-bottom:3px solid var(--y);border-radius:5px;padding:1px 3px;transition:background .15s}.es:hover{background:var(--yb)}.es.sel{background:var(--y);color:#fff}.eqs2{font-size:clamp(18px,2.6vw,30px)}.eqq2,.eqa2{font-size:clamp(20px,3.2vw,34px);font-weight:700;min-height:1.3em}.eqa2{color:var(--yd)}.eqq2.hid,.eqa2.hid{visibility:hidden}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;width:min(980px,100%)}.vc{background:#fff;border:2px solid var(--yb);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:center}.vc.done{background:#E3F4E4;border-color:var(--ok)}.vh{font-size:clamp(22px,3vw,34px);font-weight:700;color:var(--yd)}.vs{font-size:13px;color:#555}.vex{font-weight:600;min-height:1.3em;font-size:15px}.vex.hid{visibility:hidden}.vck{font-size:14px;cursor:pointer;display:flex;gap:6px;align-items:center}.vck input{accent-color:#B8860B;width:18px;height:18px}
.mybox .pic{max-height:26vh}.myword{font-weight:700;font-size:clamp(22px,3.6vw,40px);color:var(--yd);min-height:1.3em}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;width:min(1100px,100%)}.mcard{background:#fff;border:2px solid var(--yb);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center}.mimg{height:clamp(70px,13vh,110px);max-width:100%;object-fit:contain}.mlab{font-weight:700;color:var(--yd);min-height:clamp(70px,13vh,110px);display:flex;align-items:center;text-align:center}.qa{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;border-top:1px solid var(--yb);padding-top:6px;font-size:clamp(13px,1.6vw,17px)}.qaq{font-weight:700}.qaa{grid-column:1;color:var(--yd);font-weight:600}.qa .btn{grid-row:1/span 2;grid-column:2;padding:5px 12px;font-size:13px}.qaq,.qaa{visibility:hidden}.qa[data-s="1"] .qaq,.qa[data-s="2"] .qaq,.qa[data-s="2"] .qaa{visibility:visible}
.chal{font-size:clamp(18px,2.8vw,30px);font-weight:700;color:var(--yd);min-height:2.4em}.tmr{font-size:clamp(28px,5vw,52px);font-weight:700;margin-top:6px}
.mgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;width:min(1100px,100%)}
.score{font-weight:700;color:var(--yd);font-size:18px;min-height:26px}
mark.a{background:var(--y);color:#fff;border-radius:6px;padding:0 8px;font-weight:600}
#nav{display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:3px solid var(--y);background:#fff;flex-wrap:wrap}
#nav .c{flex:1;text-align:center;font-weight:600;color:var(--yd)}
#notes{width:0;overflow:hidden;background:#fff;border-left:0 solid var(--y);transition:width .25s}
#notes.open{width:min(440px,92vw);border-left:4px solid var(--y)}
#notes .in{width:min(440px,92vw);height:100%;overflow:auto;padding:16px 20px;font-size:14px;line-height:1.55}
#notes h3{margin:0 0 4px;color:var(--yd);font-size:17px}#notes h4{margin:14px 0 4px;color:var(--y);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
#notes ul,#notes ol{margin:0;padding-left:20px}#notes .meta{background:var(--yl);border-radius:10px;padding:8px 12px}
#notes pre{white-space:pre-wrap;font-family:inherit;background:#f7f7f7;border-radius:8px;padding:10px;margin:0}
#notes a{color:var(--yd);word-break:break-all}
#cert{position:fixed;inset:0;background:rgba(43,36,22,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;overflow:auto}
#cert.on{display:flex}
.cw{background:#fff;border:14px double var(--y);padding:30px 40px;max-width:820px;width:100%;text-align:center;border-radius:6px}
.cw h1{font-size:clamp(30px,5vw,54px)}.cw .nm{font-size:clamp(28px,5vw,52px);font-weight:700;color:var(--ink);border-bottom:3px solid var(--y);display:inline-block;padding:0 24px;margin:12px 0}
.cw p{font-size:clamp(14px,2vw,19px);margin:8px 0}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--y);color:#fff;padding:10px 22px;border-radius:999px;font-weight:600;display:none;z-index:40}
@media print{body>*:not(#cert){display:none!important}#cert{position:static;background:#fff;display:flex!important}.noprint{display:none!important}body{overflow:visible}}
</style>
</head>

 ss\nTT drills: Those\nTT drills: those are (keys)\nTT writes on the board\n\nControlled: https://wordwall.net/resource/35148776/this-these-that-those"}, {"k": "img", "img": "image16", "nt": {"stage": "Grammar clarification – board copy", "aim": "Teacher copies the chart onto the board after eliciting.", "inter": "T–Ss", "time": "5 min", "steps": ["Do NOT show this to students before eliciting. Copy it to the board AFTER eliciting."], "ccq": ["One or many? Near or far?"], "prob": ["Learners mix up this/that (distance) and these/those – use body language and real objects."]}, "orig": "Don’t show ss this slide. It’s for you to copy on the board after eliciting \nYou can use the same chart on the board to make it easy for them"}, {"k": "text", "title": "Let’s Speak", "nt": {"stage": "Stage divider / task instruction", "aim": "Set up the next activity clearly.", "inter": "T–Ss", "time": "1 min", "steps": ["Give instructions in short chunks, demonstrate, then check with ICQs before learners start."], "ccq": ["ICQ example: Are you working alone or in pairs? How long do you have?"], "prob": []}, "orig": "Tell your students to show each other what they have in their bags.\nTT models: this is my bag/ this is a laptop/ these are keys/ ……\n\n----------------------------------------------------------------\nAnother idea of freer: \nTT asks ss to get everything they have out on the chairs \nTT changes the places of things \nSs go around the class saying this/ that/ these/ those\nThe one who points at more things is the winner\nTT switches them \nTT monitors and takes notes \nTT takes content feedback \nTt gives language feedback"}, {"k": "sec", "num": "03", "title": "Verb to be", "img": "image7", "nt": {"stage": "Section divider", "aim": "Signal a change of stage.", "inter": "T–Ss", "time": "20 sec", "steps": ["Tell learners what they will do in this section and set a clear aim."], "ccq": [], "prob": []}, "orig": ""}, {"k": "story", "title": "Where’s Sarah?", "body": "Hello my n D.slides.splice(5,0,{k:'pre',title:'Pre-test: Everyday objects',bank:['keys','bag','watch','credit card','wallet','coins','ID','memory stick'],rows:[{img:'image9',a:'wallet'},{img:'image8',a:'watch'},{img:'image15',a:'ID'},{img:'image12',a:'coins'},{img:'image13',a:'keys'},{img:'image14',a:'bag'},{img:'image28',a:'memory stick'},{img:'image11',a:'credit card'}],orig:'Diagnostic pre-test added before the “Everyday objects” section. It uses the same pictures that appear later in the lesson.',nt:{stage:'Diagnostic pre-test (before teaching)',aim:'Find out which everyday-object words learners already know, so you can decide what to focus on and compare with the practice results later.',inter:'Individual, silent',time:'4–5 min',steps:['Tell learners this is NOT a test they can fail – it only shows you what to teach. Do not teach or give hints.','Model item 1 only if needed with a different object (e.g. a pen) so you do not give away an answer.','Learners look at each picture and choose the matching word from the drop-down. No writing is needed.','Press “Check” and note the score (and which pictures were wrong) for each learner, or ask learners to raise a hand for the number they got right.','Press “Try it again” to clear the exercise before the next learner/group. Keep “Show answers” until after the lesson (post-practice) so you do not pre-teach.','Use the results: skip the words most learners know (drill them quickly) and spend more time on the words most learners got wrong.'],ccq:['Do you write? No – you choose the word. Is it a test with marks? No – it helps me plan the lesson.'],prob:['Learners may guess – tell them it is fine to leave one blank (the Check button will mark it red).','Some learners know the word in L1 only – note it and teach the English word in the next stage.','Possible confusion: watch / clock, bag / wallet, ID / credit card.']}});
const BAG=[['image9','a wallet',1],['image8','a watch',1],['image15','an ID',1],['image12','coins',0],['image13','keys',0],['image14','a bag',1],['image28','a memory stick',1],['image11','a credit card',1]];

(function(){const i=D.slides.findIndex(x=>x.k==='table'&&/questions/.test((x.nt||{}).stage||''));D.slides.splice(i<0?D.slides.length:i,0,{k:'elicit',title:'From statements to questions',orig:'',nt:{stage:'Elicitation – yes/no questions with the verb to be (before the form chart)',aim:'Learners produce yes/no questions and short answers with am / is / are by transforming statements from the story paragraph.',inter:'T–Ss → pairs',time:'8–10 min',steps:['Learners have already highlighted the verb to be in the paragraph (slide 22). Now they turn the statements into yes/no questions. Do NOT show the form chart on the next slide yet.','Click a highlighted part of the paragraph (e.g. “It is big.”). The statement appears below with the verb underlined. Ask: “How do we ask a question about this?” Use gesture: move your hand to show the verb jumping to the front and raise your eyebrows.','Elicit “Is it big?” from the learners. Accept “It is big?” (rising intonation) and upgrade: “Yes! But which word comes first?” (the verb to be). Then press “Show question” to confirm – the verb is underlined at the front.','Write both sentences on the board with the verb in colour: It IS big. → IS it big? Drill chorally and individually; backchain longer ones (Is she a teacher at English Capsules?). Press “Listen” for a model.','Elicit the short answer: “Is it big?” → “Yes, it is.” and press “Show answer”. Do NOT accept “Yes, it’s.” Then do a negative sentence (It isn’t small. → Is it small? → No, it isn’t.) so learners see that positive and negative statements make the same question.','For sentences with I (“I’m a teacher.”) the question is about Sarah (“Is Sarah a teacher?”) – ask “Who is I?” (Sarah).','Pair work: A reads a part of the paragraph, B makes the question, A gives a short answer. Monitor and note errors. Then go to the next slide (form chart) so learners can confirm the pattern.'],ccq:['Which word moves to the front in a question? (am / is / are)','Does the verb change? (No – only its position.)','Do we say “Yes, it’s”? (No – Yes, it is.)'],prob:['Learners keep statement word order with a question mark (“She is a teacher?”) or add do/does (“Does she is a teacher?”) – recast and point to the board.','Short answers: “Yes, she’s.” → “Yes, she is.”; “No, she not.” → “No, she isn’t.”','Rising intonation on yes/no questions – model it with your hand going up.','Pronoun changes with I/my – the question is about Sarah (she).']}})})();

D.slides.forEach(s=>{if(s.k==='text'&&s.title==='Write'){s.k='wr';s.nt={stage:'Freer writing practice – personalisation with the new verbs',aim:'Learners write personalised sentences using the new verbs of the lesson (be, have, love, hate, play, live, die, sing, act, work, read) in the positive and negative (verb to be) and one yes/no question.',inter:'Individual → pairs → whole class',time:'10–12 min',steps:['Read the instructions with the class. Press “Example” on each verb card to model one sentence from the lesson and drill it chorally.','Model on the board: write 2–3 sentences about yourself (e.g. “I love tea. I hate coffee. My brother isn’t a doctor.”) so learners see what is expected.','Check instructions (ICQs below), then give learners 8 minutes to write 8 sentences in their notebooks. There is no typing box on this slide.','Monitor: help with spelling and word order, note good language and errors for feedback. Early finishers write a question with the verb to be and a negative sentence about a friend.','Learners tick “I used it” for each verb as they use it – the counter shows how many of the 11 verbs they have covered.','Peer check: learners read their sentences to a partner, who asks one yes/no question with the verb to be (Is your friend a teacher?) and gets a short answer.','Whole-class feedback: write 3–4 errors you heard/saw on the board (e.g. “I am love cats” → “I love cats”) and let learners correct them; praise good sentences.'],ccq:['Are you writing in the presentation or in your notebook? (Notebook.)','How many sentences do you write? (8.) Do you try to use every verb? (Yes, at least once.)','How many positive and negative sentences with the verb to be? (2 and 2.) How many questions? (1.)'],prob:['Mixing the verb to be with action verbs: “I am love cats” → “I love cats”.','Negatives with love/hate/play/live (don’t) have not been taught – tell learners to use only isn’t / aren’t / I’m not with the verb to be.','“play football” has no article; “I (function(){const i=D.slides.findIndex(x=>x.id==='ho1'),t=D.slides[i+1];if(i>=0&&t&&t.k==='text'){t.k='my';t.nt={stage:'Freer speaking practice – yes/no questions with the verb to be',aim:'Learners ask and answer yes/no questions with is / are and give short answers (Yes, it is. / No, they aren’t.) in a guessing game.',inter:'Pairs (A/B) → whole class',time:'8–10 min',steps:['Demonstrate with a strong learner: you are A, the learner is B. Press “Pick a mystery object”, then “Peek” to see it (the picture disappears after 3 seconds). Let B ask 2–3 questions (Is it a wallet? Is it black?) and answer with short answers.','Check the instructions (ICQs below). Learners work in pairs: A picks and peeks (turn the screen/device away from B, or the teacher picks for the class and whispers the object to A), B asks questions.','B has up to 5 questions. Press “Count a question” for each question. If B is stuck, press “Hint” (colour → one or many → size).','Press “Reveal” to show the object. Swap roles and pick a new object. Play 3–4 rounds.','Monitor and note errors (Is it a wallet? / Are they keys?, short answers). Whole-class feedback: write 3–4 examples on the board and let learners correct them.','Extension: pairs use real objects from their bags or pockets, or think of a person (Is she a teacher? Is he from Cairo?).'],ccq:['Who asks the questions? (B) Who answers? (A)','How many questions can B ask? (5) Do we answer with “Yes” or “No” only? (Yes, it is. / No, it isn’t.)','Do we use is or are for keys? (are)'],prob:['“Is they keys?” / “Are it big?” – link is to one thing and are to many.','Learners answer just “Yes/No” or “Yes, it’s.” – prompt: “Yes, it is.”','Learners ask “Do it is big?” – point to the question chart.','Looking at the screen: stress that B must not look while A peeks.']}}})();

(function(){const i=D.slides.findIndex(x=>x.k==='game'),t=D.slides[i+1];if(i>=0&&t&&t.k==='text'){t.k='sq';t.nt={stage:'Controlled-to-freer speaking practice – negative verb to be (based on slide 23)',aim:'Learners ask yes/no questions and give negative answers with isn’t / aren’t / am not about the lesson objects and about people (you, we, they, he, she).',inter:'Pairs (A/B) → whole class',time:'8–10 min',steps:['Review the negative form chart (slide 23): subject + am not / isn’t / aren’t + noun / adjective. Ask: “How do we say it is not a wallet?”','Demonstrate with a learner: press “Reveal” on the first card, read the question (“Is it a watch?”). The learner looks at the picture and answers “No, it isn’t. It is a wallet.” Press again to check.','Learners work in pairs. A presses “Reveal” and asks; B answers before the answer is revealed; they press again to check and swap roles after each card.','Each object has 2 questions: one about the noun (Is it a watch?) and one about an adjective (Is it big?). The last three cards practise you / we / they / he / she (am not, aren’t, isn’t).','Use “Reveal all” / “Hide all” for whole-class checking or to reset the cards for a second round.','Monitor and note errors: write 3–4 on the board for delayed correction. Extension: pairs make their own negative questions about real objects in the room or in their bags.'],ccq:['Who asks and who answers? (A asks, B answers.)','Is the answer yes or no? (No.) Do we say isn’t or aren’t for coins? (aren’t – they are many things.)','Do we say only “No”? (No – we add the correct sentence: It is a wallet.)'],prob:['“No, it not.” / “No, it isn’t a wallet.” – model the full answer and drill: No, it isn’t. It is a wallet.','is/are agreement with coins and keys (plural): link to “these / those”.','I am not has no contraction in the chart (not “amn’t”); learners may say “I isn’t”.','Do not look at the answer first – learners should say their own answer.']}}})();
const CH=['Ask your partner about 3 objects in their bag. Use “Is it …?” or “Are they …?”','Hide an object in your hand. Your partner has 5 questions to guess it.','Make 3 negative sentences about the classroom: “The door isn’t blue.”','Talk about a friend: say 3 things he or she is NOT: “He isn’t a doctor.”','Two truths and a lie: say 3 negative sentences about you (“I am not at home.”). Your partner finds the lie.','Ask 3 questions about people in the class: “Is she a teacher?” – answer with the verb to be.','Describe an object without its name: “It isn’t big. It isn’t brown.” Your partner guesses.','Think of a place. Your partner asks: “Is it big? Is it in Cairo?” – answer yes or no with the verb to be.'];
function sqBody(s){const grid='<div class="mgrid">'+MQ.map(m=>'<div class="mcard"><img class="mimg" src="'+IM(m[0])+'" alt="">'+qaRow(m[1])+qaRow(m[2])+'</div>').join('')+MP.map(q=>'<div class="mcard"><div class="mlab">you · we · they · he · she</div>'+qaRow(q[0])+qaRow(q[1])+'</div>').join('')+'</div><div class="row" style="margin-top:10px"><button class="btn" data-x="qaall">Reveal all</button><button class="btn o" data-x="qanone">Hide all</button></div>';return '<div class="bigtxt">'+E(s.title)+'</div><div class="card" style="text-align:left;width:min(1000px,100%);font-size:clamp(15px,2vw,22px)"><b style="color:var(--yd)">Free practice – offline (no screens)</b><ol style="margin:6px 0 0;padding-left:22px;line-height:1.55"><li>Take 3 or 4 real objects from your bag or pocket (keys, wallet, watch, ID, coins, memory stick …). Do not show your partner.</li><li>Work in pairs. Your partner asks yes/no questions to guess your objects: “Is it a wallet?” / “Are they keys?”</li><li>Answer with the verb to be: “No, it isn’t. It is …” / “No, they aren’t.” / “Yes, it is.”</li><li>Then talk about people and places: “Are you at home?” – “No, I am not.” “Is he a doctor?” – “No, he isn’t.”</li><li>Swap roles. Use the challenge cards for more ideas.</li></ol></div><div class="card" style="width:min(1000px,100%)"><div class="chal">Press “New challenge” for an idea.</div><div class="row"><button class="btn" data-x="chal">New challenge</button><button class="btn o" data-x="tim">Start 3-minute timer</button></div><div class="tmr">3:00</div></div><div class="card" style="text-align:left;width:min(1000px,100%);font-size:clamp(14px,1.8vw,20px)"><b style="color:var(--yd)">Language support – Ask:</b> Is it …? · Are they …? · Are you …? · Is he / she …?<br><b style="color:var(--yd)">Answer:</b> Yes, it is. · No, it isn’t. · Yes, they are. · No, they aren’t. · No, I am not.</div><div class="row"><button class="btn o" data-x="mq">Teacher: show model questions and answers</button></div><div class="mqw" style="display:none;width:100%">'+grid+'</div>'}
D.slides.forEach(s=>{if(s.k==='sq'){s.nt={stage:'Free speaking practice (offline) – negative verb to be and yes/no questions (based on slide 23)',aim:'Learners use is / isn’t, are / aren’t and am not freely and communicatively in pairs, with real objects and with people they know.',inter:'Pairs → groups → whole class',time:'10–12 min',steps:['Set-up (no screens): ask learners to put 3 or 4 real objects from their bags/pockets in a closed hand, bag or pocket. Model with your own objects: learner asks “Is it a watch?” – you answer “No, it isn’t. It is a wallet.”','Check instructions (ICQs below). Pair learners; A hides an object, B has up to 5 yes/no questions to guess it. Then swap roles. Repeat with new objects.','After 3–4 minutes press “New challenge” and give pairs a different task (negative sentences about the classroom, two truths and a lie, a friend, a place …). Use the 3-minute timer to keep it lively.','Pairs can also change partners (mingle) and repeat the task with a new learner – it keeps the activity communicative and gives more practice.','Keep the slide as language support only: learners do NOT read from the screen while speaking. Use “Teacher: show model questions and answers” only when you want a model or a correction check.','Monitor and note errors and good language (delayed correction): write 3–4 on the board for learners to correct. Finish with content feedback: “What was the strangest object?”'],ccq:['Do you show your partner the object? (No.)','How many questions can your partner ask? (5.)','Do we say only “No”? (No – we say “No, it isn’t. It is …”.)'],prob:['Learners read from the screen instead of speaking – hide the language support and let them speak freely.','“No, it not.” / “No, they isn’t.” – remind them: it → isn’t, they → aren’t; I → am not.','Learners do not have the objects – let them use their phones, pens, notebooks or classroom objects, or draw an object.','Early finishers: ask for more detail (colour, size) with “Is it big? Is it D.slides.forEach(s=>{if(s.k==='sq'){s.nt={stage:'Free communicative speaking practice – negative verb to be and yes/no questions (based on slide 23)',aim:'Learners use is / isn’t, are / aren’t and am not freely in real communication, with information about people they know and about themselves – no materials needed.',inter:'Pairs / groups → mingle → whole class',time:'12–15 min',steps:['Guess who? Model first: think of a famous person (or a learner in the class) and let the class ask yes/no questions (Is he a man? Is he a singer? Is he from Egypt?). Answer with short answers (Yes, he is. / No, he isn’t.). This is an information gap: only you know the answer.','Check instructions (ICQs below). Put learners in pairs or groups of 4. One learner thinks of a person; the others have 10 questions. Rotate the “thinker”.','Class survey (mingle): learners stand up and ask 4 classmates real questions (Are you tired? Are you hungry? Are you happy? Are you from Cairo?). The answers are true, so there is a real reason to ask.','Learners go back to their group and report the negative answers using the negative forms from slide 23: “Mona isn’t hungry. Ali and Sara aren’t tired. I am not tired.”','Use “New challenge” for extra tasks when pairs finish (two truths and a lie, guess the place, true or false about the classroom …) and the 3-minute timer to keep the pace.','Keep the slide as support only: learners should speak, not read. Monitor and note errors and good language for delayed correction: write 3–4 errors on the board. Finish with content feedback (Who was the hardest person to guess? How many learners are not tired?).','The picture cards under “Teacher: show model questions and answers” are only an optional model for you; they are not needed for the activity.'],ccq:['Do you say the name of the person? (No.) How many questions can you ask? (10.)','Is the survey true or invented? (True.) Do you write? (No – speak; you can note the names.)','Do we say isn’t or aren’t for Ali and Sara? (aren’t) For Mona? (isn’t) For me? (I am not.)'],prob:['Learners cannot think of a person – give categories (singer, footballer, actor) or limit it to people in the class.','“Is he singer?” – missing article; “He is not from Cairo?” – statement order; recast and write the correct question on the board.','“No, he not.” / “They isn’t.” – he/she/it → isn’t, we/you/they → aren’t, I → am not.','Learners use L1 – ask them to use the language support and give 30 seconds to rehearse before the survey.']}}});

 else if(x==='mdl'){$('.sent',sec).textContent=sec._s||'Pick an object first.'}
 else if(x==='bsay'){if(sec._s){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(sec._s);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(_){}}}
 else if(x==='khide'){$$('mark.a',sec).forEach(m=>{m.textContent='________';m.style.background='#fff';m.style.color='var(--yd)';m.style.border='2px solid var(--y)'})}
 else if(x==='kshow'){$$('mark.a',sec).forEach(m=>{m.textContent=m.dataset.a;m.removeAttribute('style')})}
});
deck.addEventListener('change',e=>{if(e.target.matches('select.g')){e.target.classList.remove('ok','no','sh')}});
function renderNotes(s){
 const n=s.nt||{};let h='<h3>Teacher notes – slide '+(cur+1)+' of '+N+'</h3>';
 if(n.stage)h+='<div class="meta"><b>Stage:</b> '+E(n.stage)+'<br><b>Aim:</b> '+E(n.aim)+'<br><b>Interaction:</b> '+E(n.inter)+' · <b>Timing:</b> '+E(n.time)+'</div>';
 if(n.steps&&n.steps.length)h+='<h4>Procedure</h4><ol>'+n.steps.map(t=>'<li>'+E(t)+'</li>').join('')+'</ol>';
 if(n.ccq&&n.ccq.length)h+='<h4>Concept / instruction checking</h4><ul>'+n.ccq.map(t=>'<li>'+E(t)+'</li>').join('')+'</ul>';
 if(n.prob&&n.prob.length)h+='<h4>Anticipated problems &amp; solutions</h4><ul>'+n.prob.map(t=>'<li>'+E(t)+'</li>').join('')+'</ul>';
 if(s.k==='obj'||s.k==='vocab')h+='<h4>Reminder</h4><ul><li>Use real objects/realia where possible and drill in words first, then sentences.</li><li>Error correction: echo, finger-count or gesture the error, then drill the correct form.</li></ul>';
 if(s.orig)h+='<h4>Original notes from the source deck</h4><pre>'+lnk(s.orig)+'</pre>';
 $('#nbody').innerHTML=h;
}
function go(i){
 if(i<0||i>=N)return;
 if(cur===0&&i>0&&!name){const v=$('#nm').value.trim();if(!v){$('#nmsg').textContent='Please type your name to start.';$('#nm').focus();return}name=v}
 try{speechSynthesis.cancel()}catch(_){}
 $$('.slide.on').forEach(x=>x.classList.remove('on'));$('#s'+i).classList.add('on');deck.scrollTop=0;cur=i;visited.add(i);
 $('#pg').style.width=(visited.size/N*100)+'%';$('#ct').textContent=(i+1)+' / '+N+' · studied '+visited.size+'/'+N;
 $('#bk').disabled=i===0;$('#nx').disabled=i===N-1;renderNotes(slides[i]);
 if(!unlocked&&visited.size===N){unlocked=true;$('#cb').style.display='';const t=$('#toast');t.textContent='You studied every slide – your certificate is ready!';t.style.display='block';setTimeout(()=>t.style.display='none',4500)}
}
$('#nx').onclick=()=>go(cur+1);$('#bk').onclick=()=>go(cur-1);
$('#tn').onclick=()=>$('#notes').classList.toggle('open');
$('#start').onclick=()=>go(1);
$('#nm').addEventListener('keydown',e=>{if(e.key==='Enter')go(1)});
$('#nm').addEventListener('input',e=>{name=e.target.value.trim();$('#nmsg').textContent='';$('#who').textContent=name});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key==='n'||e.key==='N')$('#tn').click()});
$('#cb').onclick=()=>{$('#cname').textContent=name||'Student';$('#cdate').textContent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});$('#cert').classList.add('on')};
$('#ccl').onclick=()=>$('#cert').classList.remove('on');$('#cpr').onclick=()=>{try{window.print()}catch(_){}};
go(0);
</script>
</body>
</html>
